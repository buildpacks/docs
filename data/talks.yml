- name: "Using Buildpacks To Reduce Container Bloat and Attack Surface"
  presenters:
    - Sai Bharadwaj Avvari, Salesforce
  description: >-
    Stop drowning in CVEs for unnecessary components. Most container vulnerabilities hide in
    packages never loaded at runtime, inflating security backlogs. This session uses Cloud Native
    Buildpacks to build a federated "patching waterfall": custom builders that compile and cache
    heavy, domain-specific dependencies once, OS rebasing to swap the underlying OS for hundreds of
    apps without rebuilding them, and securely debugging distroless builds with ephemeral containers.
  event_name: KubeCon India
  youtube_id: FOzJWagwBfk
  year: 2026
