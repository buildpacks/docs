- name: "Getting Buildpacks Ready for the Multi-Architecture Future"
  presenters:
    - Terence Lee, Heroku
    - Juan Bustamante, VMware
  description: >-
    Buildpacks provide a consistent and scalable way to transform source into images that run on
    any cloud. Starting with the basics of Buildpacks, Buildpack Platforms, and distributing
    Buildpacks with Builder Images, this talk discusses the challenges of supporting
    multi-architecture application images and shows how multi-architecture Buildpacks and Builder
    Images help solve them.
  event_name: KubeCon NA
  youtube_id: v1R-5LMdDq8
  year: 2023
- name: "Lightning Talk: Buildpacks: Conventional Vs. Convenient for Creating Containers"
  presenters:
    - Ram Iyengar, Cloud Foundry Foundation
  description: >-
    Writing excellent Dockerfiles is an art and maintaining them isn't for the faint of heart. In
    this talk, attendees will learn about an alternative way to create immutable artifacts for
    deployment using Cloud Native Buildpacks, which provide a uniform and repeatable build
    experience across languages and frameworks.
  event_name: KubeCon NA
  youtube_id: fI3YmfwkBag
  year: 2023
- name: "Customizing your Buildpacks Build"
  presenters:
    - Natalie Arellano, VMware
    - Aidan Delaney, Bloomberg
  description: >-
    Cloud Native Buildpacks makes building container images as easy as running “pack build.” However,
    you will eventually want to customize that out-of-the-box experience. This talk explores the many
    buildpacks extension points that enable custom workflows. For application developers, we introduce
    inline buildpacks and build time environment variables. For platform operators, we present image
    extension with Dockerfiles, and how to control the level of customization available in order to
    adhere to security requirements.
  event_name: KubeCon EU
  youtube_id: ZrxAyk1-pSs
  year: 2023
