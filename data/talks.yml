  presenters:
    - Aidan Delaney, Bloomberg
  description: >-
    An introduction to the key architecture of Buildpacks and the separation of concerns between
    the buildpack and platform APIs, with a deep dive into pack and kpack. Building on that, the
    talk workshops approaches to supporting multi-architecture builds, so applications built on
    x86_64 can produce images for both x86_64 and ARM64.
  event_name: KubeCon NA
