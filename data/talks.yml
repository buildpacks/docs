- name: "Container Image Workflows at Scale with Buildpacks"
  presenters:
    - Jesse Brown, Heroku
    - Terence Lee, Heroku
  description: >-
    Buildpacks transform source applications into images that run on any cloud. Each output image
    contains a full Software Bill of Materials which allows platform developers to know precisely
    what software is deployed. This talk looks at using Buildpacks to deploy web applications at
    scale, batch processing in large workflows - particularly AI/machine learning workflows - and
    an example Functions as a Service platform that uses Buildpacks.
  event_name: KubeCon NA
  youtube_id: lT4ULcmhVT8
