- name: "Why We Are Choosing Cloud Native Buildpacks at GitLab"
  presenters:
    - Abubakar Siddiq, GitLab
  description: >-
    GitLab's zero configuration "Auto DevOps" pipeline relies on Herokuish to detect how to build
    source code into a runnable image. The new tooling from Cloud Native Buildpacks can build
    smaller images by separating the build layers from the runtime layers. Learn about GitLab's
    goals, plan, and how they decided to move forward with Cloud Native Buildpacks.
  event_name: KubeCon EU
  youtube_id: oTC-itx6ubE
  year: 2020
- name: "Building Docker Images with Cloud Native Buildpacks"
  presenters:
    - Ben Hale, VMware
    - Terence Lee, Salesforce
  description: >-
    Creating great, secure, and efficient images can be difficult and time consuming. In this
    talk, you'll learn about Cloud Native Buildpacks, a high-level abstraction for building
    application images in a secure, reproducible, and efficient manner, and how they automate the
    delivery of both OS-level and application-level dependency upgrades.
  event_name: KubeCon EU
  youtube_id: qoM3tLlcdfs
  year: 2020
- name: "Deep Dive: Cloud Native Buildpacks"
  presenters:
    - Joe Kutner, Heroku
    - Stephen Levine, Pivotal
  year: 2019
  description: >-
    Learn why you need a buildpack and how to create one. We'll take advantage of caching and Docker
    layers to speed up rebuilds and deploys. Unlike Dockerfiles, buildpacks are composable. Finally,
    you'll learn how to rebase your application layers on a new image. This allow operators to efficiently
    handle the delivery of OS-level dependency upgrades.
  event_name: KubeCon NA
